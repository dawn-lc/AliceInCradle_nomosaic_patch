name: build

on:
  push:
    branches: [ main, modernization ]
    tags: [ 'v*' ]          # 推 v 开头的 tag（如 v2.3.0）→ 自动构建并发布 Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # gh release create 需要与 GITHUB_TOKEN 一同授予写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # —— C# WinForms 单文件工具（net48；构建 SDK 与目标框架无关）——
      - name: Build AIC_nomosaic_tool
        run: dotnet build src/AIC_nomosaic_tool -c Release

      # —— BepInEx/Harmony 插件（net48，被 Unity Mono 加载）——
      - name: Build AIC_nomosaic_bepinex
        run: dotnet build src/AIC_nomosaic_bepinex -c Release

      # —— 补丁逻辑验证器（net10）——
      - name: Build tester
        run: dotnet build src/AIC_patch_tester -c Release

      # —— 对仓库内真实补丁 DLL 跑 IL 定位/翻转/幂等验证 ——
      - name: Extract legacy patched DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force testdlls | Out-Null
          Expand-Archive "legacy/patches/Win_ver027/nomosaic_ver027b.zip" testdlls/ver027b
          Expand-Archive "legacy/patches/Win_ver028/nomosaic_ver028b.zip" testdlls/ver028b
          Expand-Archive "legacy/patches/Win_ver029/nomosaic_ver029b2.zip" testdlls/ver029b2

      - name: Run tester on real DLLs
        shell: pwsh
        run: |
          dotnet src/AIC_patch_tester/bin/Release/net10.0/AIC_patch_tester.dll testdlls/ver027b/Assembly-CSharp.dll testdlls/ver028b/Assembly-CSharp.dll testdlls/ver029b2/Assembly-CSharp.dll

      # —— 发布产物（GitHub 原生提供 Release 资产的 SHA256，无需自生成清单）——
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/AIC_nomosaic_tool/bin/Release/net48/AIC_nomosaic_tool.exe dist/
          Copy-Item src/AIC_nomosaic_bepinex/bin/Release/net48/AIC_nomosaic_bepinex.dll dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AIC_nomosaic_release
          path: dist/

      # —— tag 推送：GitHub CLI（runner 预装 gh，GITHUB_TOKEN 免配置）自动创建 Release ——
      # pwsh 无 heredoc：body 先临时落盘再 --notes-file，产物用 dist 目录通配
      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @'
          自动构建发布（CI 全部检查通过后自动上传）。

          ## 内容
          - `AIC_nomosaic_tool.exe` — 图形界面补丁工具：选择游戏 exe/目录（或拖入），
            一键安装/卸载去码补丁；检测到 BepInEx 时自动切换为释放插件方式
            （免改游戏文件，游戏更新免重打）
          - `AIC_nomosaic_bepinex.dll` — BepInEx 运行时插件（也可手动放到
            `BepInEx/plugins/`；配置见 `BepInEx/config/com.lhycloud.aic.nomosaic.cfg`）

          SHA256 校验值见 Release 资产详情（GitHub 原生提供）。

          ## 使用
          1. 下载 `AIC_nomosaic_tool.exe`，放到游戏目录（或任意位置）运行
          2. 选择游戏目录（或把游戏 exe 拖进窗口）
          3. 点"安装去码补丁"（或检测到 BepInEx 时"释放去码插件"）

          游戏：Alice In Cradle ver023～030+（支持未来版本自动定位）。
          卸载：工具内一键卸载（还原备份/删除插件），或在
          `BepInEx/plugins/` 中删除 AIC_nomosaic_bepinex.dll。
          '@ | Set-Content -Path release_notes.md -Encoding utf8

      - name: Release (gh cli)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "AIC_nomosaic $env:GITHUB_REF_NAME" `
            --notes-file release_notes.md `
            dist/AIC_nomosaic_tool.exe dist/AIC_nomosaic_bepinex.dll
